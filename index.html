<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Antwort-Karte</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#143659" />
  <style>
    /* ------------------------------------------------------------------
       Antwort-Seite — bewusst schlicht: große Touch-Flächen, hoher
       Kontrast, keinerlei Netz-Abhängigkeiten. Läuft auf iPad-Safari
       ebenso wie auf Android-Browsern.
       ------------------------------------------------------------------ */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body {
      /* min-height statt height: Bei langen Listen (Zuordnung mit
         vielen Aussagen) wächst die Seite und wird scrollbar — eine
         feste Höhe mit Flex-Zentrierung schneidet oben unerreichbar
         ab. Kurze Inhalte bleiben weiter mittig. */
      min-height: 100%;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f5f2ec;
      color: #1c2b3a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      -webkit-user-select: none;
      user-select: none;
      touch-action: manipulation;
    }
    .screen { display: none; width: 100%; max-width: 560px; text-align: center; }
    .screen.aktiv { display: flex; flex-direction: column; align-items: center; gap: 22px; }

    h1 { font-size: 1.15rem; color: #143659; font-weight: 700; }
    .hinweis-text { font-size: 1rem; color: #5a6675; line-height: 1.5; }

    /* Antwort-Buttons (MC + Wahr/Falsch) */
    .optionen {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      width: 100%;
    }
    .optionen.einspaltig { grid-template-columns: 1fr; }
    button.option {
      font-size: 2rem;
      font-weight: 700;
      padding: 26px 10px;
      border: 3px solid #143659;
      border-radius: 14px;
      background: #ffffff;
      color: #143659;
      cursor: pointer;
      font-family: inherit;
    }
    button.option.gewaehlt {
      background: #143659;
      color: #ffffff;
    }
    button.option.wahr { border-color: #047857; color: #047857; }
    button.option.wahr.gewaehlt { background: #047857; color: #fff; }
    button.option.falsch { border-color: #b91c1c; color: #b91c1c; }
    button.option.falsch.gewaehlt { background: #b91c1c; color: #fff; }

    /* Skala */
    .skala-wert {
      font-size: 4rem;
      font-weight: 800;
      color: #143659;
      font-variant-numeric: tabular-nums;
    }
    input[type="range"] {
      width: 100%;
      height: 44px;
      accent-color: #143659;
    }
    .skala-pole {
      display: flex;
      justify-content: space-between;
      width: 100%;
      color: #5a6675;
      font-size: 0.9rem;
    }

    /* Zuordnung: eine Zeile pro Aussage, rechts die Spalten-Buttons. */
    .zu-zeile {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      background: #ffffff;
      border: 2px solid #d8d2c6;
      border-radius: 12px;
      padding: 10px 12px;
    }
    .zu-label {
      flex: 1;
      min-width: 0;
      text-align: left;
      font-size: 1.05rem;
      font-weight: 700;
      color: #143659;
      overflow-wrap: anywhere;
    }
    .zu-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    button.zu-btn {
      font-size: 0.95rem;
      font-weight: 700;
      padding: 12px 14px;
      min-width: 52px;
      border: 2px solid #143659;
      border-radius: 10px;
      background: #ffffff;
      color: #143659;
      cursor: pointer;
      font-family: inherit;
    }
    button.zu-btn.gewaehlt { background: #143659; color: #ffffff; }

    /* Einloggen */
    button.einloggen {
      width: 100%;
      font-size: 1.4rem;
      font-weight: 700;
      padding: 20px;
      border: none;
      border-radius: 14px;
      background: #b8860b;
      color: #ffffff;
      cursor: pointer;
      font-family: inherit;
    }
    button.einloggen:disabled { opacity: 0.35; }

    /* QR-Anzeige: weißer Vollbild-Hintergrund für maximalen Kontrast. */
    #screen-qr.aktiv {
      position: fixed;
      inset: 0;
      max-width: none;
      background: #ffffff;
      justify-content: center;
      padding: 16px;
      z-index: 10;
    }
    #qr-canvas { max-width: 88vmin; max-height: 70vh; }
    .qr-antwort {
      font-size: 1.3rem;
      color: #5a6675;
    }
    .qr-antwort strong { color: #143659; font-size: 1.6rem; }
    button.aendern {
      font-size: 1.05rem;
      padding: 12px 26px;
      border: 2px solid #143659;
      border-radius: 10px;
      background: #ffffff;
      color: #143659;
      cursor: pointer;
      font-family: inherit;
    }
    .qr-tipp { font-size: 0.85rem; color: #8a94a3; }
    .schnellwahl {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .schnellwahl:empty { display: none; }
    button.schnell {
      min-width: 58px;
      font-size: 1.3rem;
      font-weight: 700;
      padding: 12px 14px;
      border: 2px solid #143659;
      border-radius: 10px;
      background: #ffffff;
      color: #143659;
      cursor: pointer;
      font-family: inherit;
    }
    button.schnell.gewaehlt { background: #143659; color: #fff; }
    button.schnell.wahr { border-color: #047857; color: #047857; }
    button.schnell.wahr.gewaehlt { background: #047857; color: #fff; }
    button.schnell.falsch { border-color: #b91c1c; color: #b91c1c; }
    button.schnell.falsch.gewaehlt { background: #b91c1c; color: #fff; }
  </style>
</head>
<body>
  <!-- Ohne Parameter: Warte-Hinweis. -->
  <section id="screen-hinweis" class="screen">
    <h1>Antwort-Karte</h1>
    <p class="hinweis-text">
      Scanne den QR-Code an der Tafel,<br />um an der Abstimmung teilzunehmen.
    </p>
  </section>

  <!-- Auswahl (Buttons oder Skala, wird per JS befüllt). -->
  <section id="screen-auswahl" class="screen">
    <h1 id="auswahl-titel">Deine Antwort</h1>
    <div id="auswahl-bereich" class="optionen"></div>
    <button id="btn-einloggen" class="einloggen" disabled>
      ✓ Antwort einloggen
    </button>
  </section>

  <!-- QR-Vollbild. -->
  <section id="screen-qr" class="screen">
    <p class="qr-antwort">
      Deine Antwort: <strong id="qr-antwort-text"></strong>
    </p>
    <canvas id="qr-canvas"></canvas>
    <p class="qr-tipp">Bildschirm hell stellen und hochhalten,<br />bis die Lehrkraft gescannt hat.</p>
    <!-- Schnellwahl: bei der nächsten Frage reicht EIN Tap — der QR
         wird sofort neu erzeugt (nur mc/wf, per JS befüllt). -->
    <div id="qr-schnellwahl" class="schnellwahl"></div>
    <button id="btn-aendern" class="aendern">Antwort ändern</button>
  </section>
